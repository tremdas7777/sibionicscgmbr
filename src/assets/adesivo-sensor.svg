<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f5f2"/>
      <stop offset="1" stop-color="#b9e4de"/>
    </linearGradient>
    <radialGradient id="patch" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ede8"/>
    </radialGradient>
    <radialGradient id="sensor" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#e6ebee"/>
      <stop offset="1" stop-color="#c9d2d8"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b5450" flood-opacity="0.22"/>
    </filter>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3h6M3 0v6" stroke="#e7e1d9" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#bg)"/>

  <!-- adesivo de trás, com papel protetor -->
  <g filter="url(#shadow)" transform="translate(268 120) rotate(14)">
    <circle r="78" fill="#ffffff"/>
    <circle r="78" fill="url(#weave)" opacity="0.7"/>
    <circle r="31" fill="#b9e4de"/>
    <path d="M-78 0 A78 78 0 0 1 78 0 Z" fill="#43b2ac" opacity="0.18"/>
    <circle r="78" fill="none" stroke="#ddd6cc" stroke-width="2"/>
    <circle r="31" fill="none" stroke="#ddd6cc" stroke-width="2"/>
  </g>

  <!-- adesivo do meio -->
  <g filter="url(#shadow)" transform="translate(132 150) rotate(-10)">
    <circle r="82" fill="url(#patch)"/>
    <circle r="82" fill="url(#weave)" opacity="0.8"/>
    <circle r="33" fill="#cfece8"/>
    <circle r="82" fill="none" stroke="#ddd6cc" stroke-width="2"/>
    <circle r="33" fill="none" stroke="#ddd6cc" stroke-width="2"/>
  </g>

  <!-- adesivo da frente, já com o sensor no centro -->
  <g filter="url(#shadow)" transform="translate(212 262)">
    <circle r="96" fill="url(#patch)"/>
    <circle r="96" fill="url(#weave)" opacity="0.8"/>
    <circle r="96" fill="none" stroke="#ddd6cc" stroke-width="2"/>
    <circle r="40" fill="url(#sensor)" stroke="#b8c3ca" stroke-width="2"/>
    <circle r="28" fill="none" stroke="#d2dade" stroke-width="2"/>
    <circle r="5" fill="#43b2ac"/>
  </g>

  <!-- selo de quantidade -->
  <g transform="translate(64 330)">
    <rect x="-40" y="-24" width="92" height="48" rx="24" fill="#2f9f9b"/>
    <text x="6" y="8" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">10x</text>
  </g>
</svg>
